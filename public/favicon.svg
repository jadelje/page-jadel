<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#0a0f1e"/>

  <!-- Accent bar left -->
  <rect x="4" y="8" width="3" height="16" rx="1.5" fill="#3b82f6"/>

  <!-- DP in bold blue -->
  <text x="9" y="20" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="11" fill="#f1f5f9">DP</text>

  <!-- Tics in cyan, smaller, baseline-aligned -->
  <text x="9" y="27" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="7" letter-spacing="0.5" fill="#06b6d4">TICS</text>
</svg>
